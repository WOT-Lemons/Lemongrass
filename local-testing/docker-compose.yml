# Local-only test stack. Non-secret credentials are inlined on purpose so that
#   docker compose -f local-testing/docker-compose.yml up
# works with no --env-file flag. Do NOT use these values anywhere real.
name: lemongrass-local

services:
  influxdb:
    image: influxdb:2@sha256:a450f6faf9573e6c2e96a0f575885ae8b7387cc87e4de94599e247ebfa3ac417
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: local-dev-password
      DOCKER_INFLUXDB_INIT_ORG: lemongrass
      DOCKER_INFLUXDB_INIT_BUCKET: laps
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: local-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./influx-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    # Published so the CLI can run on the host against the local stack, the same
    # reason influxdb publishes 8086. Without this, the host CLI (e.g.
    # `lemongrass db import-legacy`) cannot reach the database.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: lemongrass
      POSTGRES_PASSWORD: local-dev-password
      POSTGRES_DB: lemongrass
    # postgres:18+ images expect a single mount at /var/lib/postgresql (not
    # .../data) — see the image's own migration notes in docker-library/postgres#1259.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Check over TCP: on a fresh volume the entrypoint's temporary init server
      # listens only on the Unix socket, so a socket check can pass before the
      # real server is reachable at postgres:5432.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "lemongrass"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Postgres only creates an empty database. This one-shot container applies the
  # schema (every migration, plus the curated tracks data) so a fresh volume comes
  # up with all tables, and an existing one picks up any newer migrations.
  # pull_policy: build rebuilds the image on every `up` (cached, so cheap) so it
  # always carries this checkout's migrations. If it fails with "Can't locate
  # revision", the database is ahead of this checkout (migrated from a newer
  # branch or worktree): run the stack from that checkout instead, or wipe all
  # local data with `docker compose down -v`.
  db-schema:
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: build
    command:
      - /bin/sh
      - -c
      - |
        cat > /tmp/lemongrass.toml <<'TOML'
        [postgres]
        host = "postgres"
        port = 5432
        database = "lemongrass"
        user = "lemongrass"
        TOML
        exec lemongrass db upgrade
    environment:
      LEMONGRASS_CONFIG: /tmp/lemongrass.toml
      LEMONGRASS_DB_PASSWORD: local-dev-password
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.3@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      influxdb:
        condition: service_healthy
      db-schema:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-dev-password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  # Grafana has no file provisioning for library panels — they live only in its
  # database. This one-shot container pushes them over the HTTP API so the
  # provisioned dashboards' library-panel-ref tiles resolve, mirroring prod.
  grafana-library-panels:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    depends_on:
      - grafana
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_AUTH: admin:local-dev-password
    volumes:
      - ./grafana/library_panels:/library_panels:ro
      - ./grafana/bootstrap-library-panels.sh:/bootstrap-library-panels.sh:ro
    entrypoint: ["sh", "/bootstrap-library-panels.sh"]
    restart: on-failure:3

  elm327:
    build:
      context: elm327
    # Port comes from OBD_EMULATOR_PORT (.env); compose interpolates it into
    # this exec-form command, overriding the image's default CMD.
    command: ["python", "-m", "elm", "-s", "car", "-n", "${OBD_EMULATOR_PORT}"]
    stdin_open: true   # emulator's cmd console exits on stdin EOF
    healthcheck:
      # Healthy only once the emulator socket accepts connections, so telem
      # doesn't race the listener. python is present in the uv base image.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', ${OBD_EMULATOR_PORT}), timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  telem:
    build:
      context: ..
      dockerfile: Dockerfile
    # Non-secret settings come from a generated TOML config (secrets-only env model).
    # Generated at startup so the emulator port stays sourced from OBD_EMULATOR_PORT
    # (compose interpolates ${OBD_EMULATOR_PORT} into the command, same as elm327).
    command:
      - /bin/sh
      - -c
      - |
        cat > /tmp/lemongrass.toml <<'TOML'
        [influx]
        url = "http://influxdb:8086"
        org = "lemongrass"

        [telem.obd]
        port = "socket://elm327:${OBD_EMULATOR_PORT}"
        baudrate = 38400
        TOML
        exec lemongrass telem
    environment:
      LEMONGRASS_CONFIG: /tmp/lemongrass.toml
      INFLUX_TELEMETRY_TOKEN: local-dev-token
    volumes:
      # Persist /data (the spool lives at /data/telem-spool) so buffered points
      # survive a telem restart — lets the outage->restart->recovery path be
      # exercised locally: stop influxdb, let points spool, restart telem, then
      # start influxdb and watch the spool drain.
      - telem-data:/data
    depends_on:
      influxdb:
        condition: service_healthy
      elm327:
        condition: service_healthy

volumes:
  influxdb-data:
  grafana-data:
  postgres-data:
  telem-data:
