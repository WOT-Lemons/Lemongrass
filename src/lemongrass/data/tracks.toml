# Canonical venues, layouts, and events for track identity.
#
# This file is curated by hand and reviewed in a pull request — it states facts
# about the world, identical for every deployment. `lemongrass tracks sync`
# copies it into the venues/layouts/events tables; `lemongrass races identify`
# re-tags stored races from it and reports every track name it could not match.
#
# Rules the loader enforces, and the two the curator has to remember:
#   * A venue whose only course is unnamed declares NO [[venue.layout]] at all.
#   * Matching is one-directional prefix matching, so an input LONGER than the
#     canonical name needs nothing ("Road Atlanta, Braselton GA"), but any form
#     SHORTER than it must be listed as an alias ("Gingerman", "Nola").

[[venue]]
id = "thompson"
name = "Thompson Speedway Motorsports Park"
aliases = ["thompson motor speedway", "thompson raceway motorsports park",
           "thompson speedway", "thompson raceway"]

[[venue]]
id = "gingerman"
name = "Gingerman Raceway"
aliases = ["gingerman"]

