# Canonical venues and layouts for track identity.
#
# This file is curated by hand and reviewed in a pull request — it states facts
# about the world, identical for every deployment. `lemongrass tracks sync`
# copies it into the venues/layouts tables; `lemongrass races identify`
# re-tags stored races from it and reports every track name it could not match.
#
# Events are deliberately NOT curated here: an event is a naming convention
# rather than a place, so `race.event_id` stays NULL until there is a better
# home for it. The loader and schema still support a `[[series]]` /
# `[[series.event]]` table, and remain fully exercised by tests — this file
# simply carries none.
#
# Rules the loader enforces, and the two the curator has to remember:
#   * A venue declares NO [[venue.layout]] when no surveyed track name carries
#     a course name — not necessarily because the venue has only one course
#     ("pittrace" has named configurations; none appear in the data).
#   * Matching is one-directional prefix matching, so an input LONGER than the
#     canonical name needs nothing ("Road Atlanta, Braselton GA"), but any form
#     SHORTER than it must be listed as an alias ("Gingerman", "Nola").
#
# A layout name may be promoted to a VENUE alias when the production data
# carries it with no venue prefix at all ("thunderbolt" on "njmp"). The venue
# match then consumes the whole text, so `resolve` falls back to matching that
# venue's layouts against the full track name instead of the (now empty)
# remainder, and still finds the layout. This is intentional, not a bug.

[[venue]]
id = "thompson"
name = "Thompson Speedway Motorsports Park"
aliases = ["thompson motor speedway", "thompson raceway motorsports park",
           "thompson speedway", "thompson raceway"]

[[venue]]
id = "gingerman"
name = "Gingerman Raceway"
aliases = ["gingerman"]

[[venue]]
id = "the-ridge"
name = "The Ridge Motorsports Park"
aliases = ["the ridge"]

[[venue]]
id = "nola"
name = "NOLA Motorsports Park"
aliases = ["nola"]

[[venue]]
id = "road-atlanta"
name = "Road Atlanta"
aliases = []

[[venue]]
id = "sonoma"
name = "Sonoma Raceway"
aliases = []

[[venue]]
id = "high-plains"
name = "High Plains Raceway"
aliases = []

[[venue]]
id = "autobahn"
name = "Autobahn Country Club"
aliases = []

[[venue]]
id = "nhms"
name = "New Hampshire Motor Speedway"
aliases = []

[[venue]]
id = "njmp"
name = "New Jersey Motorsports Park"
aliases = ["njmp", "thunderbolt"]

  [[venue.layout]]
  id = "thunderbolt"
  name = "Thunderbolt Course"
  aliases = ["thunderbolt"]

  [[venue.layout]]
  id = "lightning"
  name = "Lightning Course"
  aliases = ["lightning"]

[[venue]]
id = "pittrace"
name = "Pittsburgh International Race Complex"
aliases = ["pittsburgh int l race complex", "pittsburgh international raceway"]
