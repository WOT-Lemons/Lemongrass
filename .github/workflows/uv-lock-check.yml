name: Lock File Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/uv-lock-check.yml'

jobs:
  sync-lock:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Sync lock file (release-please PRs)
        run: |
          uv lock --upgrade
          git config user.name "wot-lemons-release-please[bot]"
          git config user.email "279497434+wot-lemons-release-please[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --staged --quiet && exit 0
          git commit -m "chore: sync uv.lock"
          git push

  verify-lock:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Verify lock file is up to date
        run: uv lock --check
