name: Python Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'local-testing/**'
      # Curated package data is edited by hand and reviewed in a PR, and
      # test_tracks.py is what catches a duplicate id, a colliding alias, or a
      # name that normalizes to nothing. Without this, a tracks.toml-only PR
      # runs no CI at all and a bad edit reaches a live capture as a crash.
      - 'src/lemongrass/data/**'

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: lemongrass
          POSTGRES_PASSWORD: local-dev-password
          POSTGRES_DB: lemongrass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Run tests
        env:
          LEMONGRASS_TEST_DATABASE_URL: postgresql+psycopg://lemongrass:local-dev-password@localhost:5432/lemongrass
          LEMONGRASS_TEST_DB_ALLOW_WIPE: "1"
        run: uv run --frozen --with pytest pytest tests/

      # The migrations and the curated track data ship as package data, so
      # `lemongrass db upgrade` and track resolution work from a wheel with no
      # checkout. Only a real build proves that: a stray build-backend exclude
      # would drop these files and nothing else would notice until deployment.
      - name: Verify package data ships in the wheel
        run: |
          uv build --wheel
          uv run python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob('dist/*.whl'))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())
          need = ['lemongrass/migrations/env.py',
                  'lemongrass/migrations/script.py.mako',
                  'lemongrass/migrations/versions/0001_initial.py',
                  'lemongrass/migrations/versions/0002_identity.py',
                  'lemongrass/data/tracks.toml']
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f'missing from {wheel}: {missing}')
          print(f'all migration files present in {wheel}')
          PY

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.14"

      - name: Sync project (frozen)
        run: uv sync --frozen

      - name: Install ELM327 emulator
        run: bash local-testing/install-emulator.sh

      - name: Run integration tests
        run: uv run --no-sync pytest -m integration tests/
