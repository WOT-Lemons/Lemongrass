name: Python Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'local-testing/**'

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: lemongrass
          POSTGRES_PASSWORD: local-dev-password
          POSTGRES_DB: lemongrass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Run tests
        env:
          LEMONGRASS_TEST_DATABASE_URL: postgresql+psycopg://lemongrass:local-dev-password@localhost:5432/lemongrass
          LEMONGRASS_TEST_DB_ALLOW_WIPE: "1"
        run: uv run --frozen --with pytest pytest tests/

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.14"

      - name: Sync project (frozen)
        run: uv sync --frozen

      - name: Install ELM327 emulator
        run: bash local-testing/install-emulator.sh

      - name: Run integration tests
        run: uv run --no-sync pytest -m integration tests/
