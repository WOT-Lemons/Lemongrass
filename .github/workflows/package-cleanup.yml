name: Package Cleanup

on:
  pull_request:
    types: [closed]
    branches:
      - main
  schedule:
    - cron: '0 23 * * *' # daily at 23:00 UTC
  workflow_dispatch:

jobs:
  cleanup-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [lemongrass]
    steps:
      - name: Delete ${{ matrix.package }} PR image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --paginate: each image build adds ~9 versions, so a PR image can
          # fall off the first page (30) before the PR closes.
          version_id=$(gh api /orgs/wot-lemons/packages/container/${{ matrix.package }}/versions --paginate \
            --jq '.[] | select(any(.metadata.container.tags[]; . == "pr-${{ github.event.pull_request.number }}")) | .id' \
            2>/dev/null)
          if [ -n "$version_id" ]; then
            gh api --method DELETE /orgs/wot-lemons/packages/container/${{ matrix.package }}/versions/"$version_id"
            echo "Deleted ${{ matrix.package }} pr-${{ github.event.pull_request.number }}"
          else
            echo "No image found for ${{ matrix.package }} pr-${{ github.event.pull_request.number }}, skipping"
          fi

  cleanup-scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [lemongrass]
    steps:
      # Runs before the prune so the deleted image's platform manifests and
      # attestations are swept in the same run rather than the next night.
      - name: Delete ${{ matrix.package }} PR images for closed PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Self-heal: prune pr-* images whose PR is no longer open. The
          # cleanup-pr job only catches a clean "closed" event for a single PR
          # number; superseded/autoclosed bot PRs can slip through, so sweep
          # them here on the scheduled run.
          gh api /orgs/wot-lemons/packages/container/${{ matrix.package }}/versions --paginate \
            --jq '.[] | select(.metadata.container.tags[]? | startswith("pr-")) | "\(.id) \(.metadata.container.tags[] | select(startswith("pr-")))"' | \
          while read -r version_id tag; do
            pr_number="${tag#pr-}"
            state=$(gh api /repos/${{ github.repository }}/pulls/"$pr_number" --jq '.state' 2>/dev/null || echo "")
            if [ "$state" = "closed" ]; then
              gh api --method DELETE /orgs/wot-lemons/packages/container/${{ matrix.package }}/versions/"$version_id"
              echo "Deleted ${{ matrix.package }} $tag (PR #$pr_number closed)"
            else
              echo "Keeping ${{ matrix.package }} $tag (PR #$pr_number state=${state:-unknown})"
            fi
          done

      - name: Prune unreferenced ${{ matrix.package }} versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PKG: ${{ matrix.package }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            // Mark-and-sweep over a single snapshot of the package's versions.
            // Keep:
            //   - every version with a real (non sha256-<hex>) tag,
            //   - the manifests any kept version references,
            //   - sha256-<digest> attestation indexes whose subject is kept,
            // and delete everything else. This removes a whole orphan chain
            // (untagged index -> its attestation -> the SBOM blobs that
            // attestation wrapped) in one run, reading each tagged manifest once.
            const org = 'wot-lemons';
            const pkg = process.env.PKG;
            const ref = { package_type: 'container', org, package_name: pkg };
            const isAttestationTag = (t) => /^sha256-[0-9a-f]{64}$/.test(t);
            const tagsOf = (v) => v.metadata.container.tags;

            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
              { ...ref, per_page: 100 },
            );

            // Manifests live in the registry, not the REST API: exchange the
            // workflow token for a ghcr.io pull token.
            const basic = Buffer.from(`${context.actor}:${process.env.REGISTRY_TOKEN}`).toString('base64');
            const tokenRes = await fetch(
              `https://ghcr.io/token?service=ghcr.io&scope=repository:${org}/${pkg}:pull`,
              { headers: { Authorization: `Basic ${basic}` } },
            );
            if (!tokenRes.ok) throw new Error(`ghcr.io token exchange failed: HTTP ${tokenRes.status}`);
            const { token } = await tokenRes.json();
            const accept = [
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
              'application/vnd.oci.image.manifest.v1+json',
              'application/vnd.docker.distribution.manifest.v2+json',
            ].join(', ');

            const versionGone = async (id) => {
              try {
                await github.rest.packages.getPackageVersionForOrganization({ ...ref, package_version_id: id });
                return false;
              } catch (err) {
                if (err.status === 404) return true;
                throw err;
              }
            };

            // Child digests of a version's manifest, or null when the version
            // is already gone (the listing can briefly lag deletions). Any other
            // failure aborts the run: treating a live image's children as
            // unreferenced would delete them.
            const childrenOf = async (v) => {
              const res = await fetch(`https://ghcr.io/v2/${org}/${pkg}/manifests/${v.name}`, {
                headers: { Authorization: `Bearer ${token}`, Accept: accept },
              });
              if (res.ok) return ((await res.json()).manifests ?? []).map((m) => m.digest);
              if (res.status === 404 && (await versionGone(v.id))) return null;
              throw new Error(`Failed to read ${pkg}@${v.name} (version ${v.id}): HTTP ${res.status}`);
            };

            const mapLimit = async (items, limit, fn) => {
              const out = new Array(items.length);
              let next = 0;
              const worker = async () => {
                while (next < items.length) {
                  const i = next++;
                  out[i] = await fn(items[i]);
                }
              };
              await Promise.all(Array.from({ length: limit }, worker));
              return out;
            };

            const tagged = versions.filter((v) => tagsOf(v).length > 0);
            const children = new Map();
            const gone = new Set();
            (await mapLimit(tagged, 8, childrenOf)).forEach((kids, i) => {
              if (kids === null) gone.add(tagged[i].name);
              else children.set(tagged[i].name, kids);
            });
            const live = versions.filter((v) => !gone.has(v.name));

            const attestationsBySubject = new Map();
            for (const v of live) {
              const tag = tagsOf(v).find(isAttestationTag);
              if (!tag) continue;
              const subject = `sha256:${tag.slice('sha256-'.length)}`;
              attestationsBySubject.set(subject, [...(attestationsBySubject.get(subject) ?? []), v.name]);
            }

            const keep = new Set();
            const stack = live.filter((v) => tagsOf(v).some((t) => !isAttestationTag(t))).map((v) => v.name);
            while (stack.length > 0) {
              const digest = stack.pop();
              if (keep.has(digest)) continue;
              keep.add(digest);
              stack.push(...(children.get(digest) ?? []), ...(attestationsBySubject.get(digest) ?? []));
            }

            let deleted = 0;
            for (const v of live.filter((v) => !keep.has(v.name))) {
              const label = tagsOf(v).join(',') || '<untagged>';
              try {
                await github.rest.packages.deletePackageVersionForOrg({ ...ref, package_version_id: v.id });
                core.info(`Deleted ${pkg} version ${v.id} ${label} (${v.name})`);
                deleted++;
              } catch (err) {
                if (err.status !== 404) throw err;
                core.info(`Already gone: ${pkg} version ${v.id} (${v.name})`);
              }
            }
            core.info(`Kept ${keep.size} version(s), deleted ${deleted}`);
